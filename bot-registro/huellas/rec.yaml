# Huellas y pasos del Registro Electrónico General (reg.redsara.es).
#
# Escritas a partir del envío manual de referencia a Gandia (REGAGE26e00093912184,
# 01/11/2026), de las capturas de Cl@ve y de la exploración de los componentes del
# formulario (python src/main.py grabar / analizar-capturas / explorar-reg).
#
# Cualquier cambio en este archivo obliga a repetir el modo prueba:
#   python src/main.py enviar --prueba --max 5
#
# Notas del formulario:
# - Los campos son componentes propios (dnt-input, dnt-select, dnt-checkbox…). Los
#   selectores CSS de Playwright entran en su shadow DOM: 'dnt-input[formcontrolname="subject"] input'.
# - Los desplegables se abren y se pulsa la opción con la acción 'elegir'.
# - Dirección, teléfono y correo aparecen dos veces (representante e interesado):
#   '>> nth=0' es el del representante y '>> nth=1' el del interesado.
# - Los botones se localizan por su nombre accesible: 'role=button[name="Siguiente"]'.
#
# Campos disponibles: {municipio} {asunto} {expone} {solicita} {dir3_ayto} {dir3_destino}
# {razon_social} {cif} {email} {telefono} {via_tipo} {via_nombre} {provincia} {poblacion} {cp}

plataforma: REC
verificada: true

pantallas:
  login:
    url: 'reg\.redsara\.es/es/login'
    etiquetas: ["Inicio de sesión", "Accede con tu Cl@ve"]
  clave:
    url: 'clave\.gob\.es'
    etiquetas: ["DNIe / Certificado electrónico"]
  inicio:
    url: 'reg\.redsara\.es/es/?(\?.*)?$'
    etiquetas: ["Destacados"]
  paso1:
    url: 'reg\.redsara\.es/es/nuevo-registro'
    etiquetas: ["Datos del solicitante (Paso 1 de 4)"]
  paso2:
    url: 'reg\.redsara\.es/es/nuevo-registro'
    etiquetas: ["Datos de solicitud (Paso 2 de 4)"]
  paso3:
    url: 'reg\.redsara\.es/es/nuevo-registro'
    etiquetas: ["Documentación (Paso 3 de 4)"]
  resumen:
    url: 'reg\.redsara\.es/es/nuevo-registro'
    etiquetas: ["A continuación tienes el resumen de la solicitud de registro electrónico", "Órgano destino"]
  justificante:
    url: 'reg\.redsara\.es/es/detalle-registro/'
    etiquetas: ["Detalle del registro", "Número de registro"]

# Abrir "Nuevo registro". Si ya hay sesión, se salta el inicio de sesión.
# Con la política de Chrome (configurar-certificado) el certificado se elige solo.
apertura:
  - &ir_nuevo
    acciones:
      - ir: "https://reg.redsara.es/es/nuevo-registro"
  - &login
    si_pantalla: login
    acciones:
      - clic: 'text=Accede con tu Cl@ve >> visible=true >> nth=0'
  - &clave
    si_pantalla: clave
    acciones:
      - clic: 'button.idp-button:has-text("Certificado electrónico")'
      - esperar: 6
  - &tras_login
    si_pantalla: inicio
    acciones:
      - ir: "https://reg.redsara.es/es/nuevo-registro"
  - &en_paso1
    esperar_pantalla: paso1
    timeout_seg: 120
    mensaje: "Abriendo el formulario del REG (iniciando sesión si hace falta)"

rellenado:
  # Paso 1: representante (titular del certificado) e interesado (la sociedad)
  - &paso1
    pantalla: paso1
    acciones:
      - clic: 'dnt-radio-group[formcontrolname="typeRepresented"] >> text=Representante'
      - esperar: 1
      - elegir: {selector: 'dnt-select[id="represented.streetType"] [role="combobox"]', valor: "{via_tipo}"}
      - rellenar: {selector: 'dnt-input[formcontrolname="streetName"] >> nth=0 >> input', valor: "{via_nombre}"}
      - elegir: {selector: 'dnt-select[id="represented.province"] [role="combobox"]', valor: "{provincia}"}
      - esperar: 1
      - elegir: {selector: 'dnt-select[id="represented.city"] [role="combobox"]', valor: "{poblacion}"}
      - rellenar: {selector: 'dnt-input[formcontrolname="zipCode"] >> nth=0 >> input', valor: "{cp}"}
      - rellenar: {selector: 'dnt-input[formcontrolname="phone"] >> nth=0 >> input', valor: "{telefono}"}
      - rellenar: {selector: 'dnt-input[formcontrolname="email"] >> nth=0 >> input', valor: "{email}"}
      - elegir: {selector: 'dnt-select[id="tipoDoc"] [role="combobox"]', valor: "CIF"}
      - rellenar: {selector: 'dnt-input[formcontrolname="docNumber"] input', valor: "{cif}"}
      - esperar: 1
      - rellenar: {selector: 'dnt-input[formcontrolname="businessName"] input', valor: "{razon_social}"}
      - elegir: {selector: 'dnt-select[id="streetType"] [role="combobox"]', valor: "{via_tipo}"}
      - rellenar: {selector: 'dnt-input[formcontrolname="streetName"] >> nth=1 >> input', valor: "{via_nombre}"}
      - elegir: {selector: 'dnt-select[id="interested.province"] [role="combobox"]', valor: "{provincia}"}
      - esperar: 1
      - elegir: {selector: 'dnt-select[id="interested.city"] [role="combobox"]', valor: "{poblacion}"}
      - rellenar: {selector: 'dnt-input[formcontrolname="zipCode"] >> nth=1 >> input', valor: "{cp}"}
      - rellenar: {selector: 'dnt-input[formcontrolname="phone"] >> nth=1 >> input', valor: "{telefono}"}
      - rellenar: {selector: 'dnt-input[formcontrolname="email"] >> nth=1 >> input', valor: "{email}"}
      - marcar:
          selector: 'dnt-checkbox[formcontrolname="emailAlert"] input[type="checkbox"]'
          clic: 'dnt-checkbox[formcontrolname="emailAlert"] label'
      - clic: 'role=button[name="Siguiente"][disabled=false]'
  # Paso 2: organismo destinatario y textos
  - pantalla: paso2
    acciones:
      - elegir_destinatario: true
      - rellenar: {selector: 'dnt-input[formcontrolname="subject"] input', valor: "{asunto}"}
      - rellenar: {selector: 'dnt-input[formcontrolname="exposes"] textarea', valor: "{expone}"}
      - rellenar: {selector: 'dnt-input[formcontrolname="solicit"] textarea', valor: "{solicita}"}
      - clic: 'role=button[name="Siguiente"][disabled=false]'
  # Paso 3: documentación
  - pantalla: paso3
    acciones:
      - adjuntar: {selector: '#attachments', archivo: carta}
      - esperar: 3
      - adjuntar: {selector: '#attachments', archivo: dossier}
      - esperar: 4
      - clic: 'role=button[name="Siguiente"][disabled=false]'
  - pantalla: resumen

# Buscador de organismos: se busca por código DIR3 (primero la unidad de la hoja,
# Fiestas/Cultura si existe; si no aparece, el ayuntamiento) y se pulsa "Seleccionar"
# solo si hay un único resultado con ese código.
destinatario:
  modo: codigo
  abrir:
    - clic: 'role=button[name="Asistente de búsqueda"]'
  filtros:
    - {selector: 'dnt-select[id="administrationLevel"] [role="combobox"]', valor: "Administración Local"}
  campo_busqueda: 'dnt-input[formcontrolname="search"] input'
  boton_buscar: 'role=button[name="Buscar"]'
  boton_seleccionar: 'role=button[name="Seleccionar"]'
  espera_resultados_seg: 1
  confirmacion: 'dnt-select[id="destinationOrganism"]'
  cerrar:
    - pulsar: {selector: 'dnt-input[formcontrolname="search"] input', tecla: "Escape"}

# Lectura del resumen para la verificación previa a la firma
resumen:
  pantalla: resumen
  etiquetas:
    destinatario_codigo: "Órgano destino:"
    destinatario_nombre: "Órgano destino:"
    asunto: "Asunto:"
  adjuntos_regex: 'Documento PDF ([\w.\-]+\.pdf)'
  cancelar: []

firma:
  acciones:
    - marcar:
        selector: 'dnt-checkbox[formcontrolname="checkTerms"] input[type="checkbox"]'
        clic: 'dnt-checkbox[formcontrolname="checkTerms"] label'
    - clic: 'role=button[name="Firmar y registrar"]'
  pasos:
    - si_pantalla: clave
      acciones:
        - clic: 'button.idp-button:has-text("Certificado electrónico")'
  aceptar_dialogos: false
  mensaje: "Firmando con Cl@ve y el certificado (sin intervención)"

justificante:
  pantalla: justificante
  etiquetas:
    num_registro: "Número de registro:"
    fecha: "Fecha de registro:"
  regex_num_registro: '([A-Z]{3,}\w+)'
  descargar: 'role=button[name="Descargar justificante"]'

# Fase 2: llegar al buscador de organismos (paso 2) sin enviar nada
deteccion:
  - *ir_nuevo
  - *login
  - *clave
  - *tras_login
  - *en_paso1
  - *paso1
  - pantalla: paso2
